def versionsPropertiesFile = rootProject.file("version.properties")
def versionProperties = new Properties()
versionProperties.load(new FileInputStream(versionsPropertiesFile))

ext {
    abiCodes = ['armeabi-v7a': 1, 'x86_64': 2, 'arm64-v8a': 3]
}

android {
    compileSdk 37
    namespace 'com.afkanerd.deku.DefaultSMS'
    buildToolsVersion "37.0.0"

    def _versionName = versionProperties['versionName']
    def tagVersion = Integer.parseInt(versionProperties['tagVersion'])

    println(tagVersion)
    println(_versionName)

    splits {

        abi {
            def isBuildingBundle = gradle.startParameter.taskNames.any {
                it.toLowerCase().contains("bundle")
            }

            // Disable split abis when building appBundle
//            isEnable = !isBuildingBundle
            enable !isBuildingBundle
            reset()
            include "arm64-v8a", "armeabi-v7a", "x86_64"
            universalApk false
        }
    }

    defaultConfig {
        applicationId "com.afkanerd.deku"
        minSdk 24
        targetSdk 37
        versionCode tagVersion
        versionName _versionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }

        ksp {
            arg('room.schemaLocation', "$projectDir/schemas")
        }

    }

    buildFeatures {
        compose true
        buildConfig true
    }

    buildscript {
        ext {
            compose_compiler = '1.3.1'         //compiler
            compose_version = '1.3.0-beta02'   //compose dependencies
            compose_material3 = '1.0.0-beta02' //material3 release
        }
        //...
    }

    sourceSets {
        androidTest.assets.srcDirs += files("$projectDir/schemas".toString())

        main {
            jniLibs.srcDirs = ['libs']
            java {
                exclude 'com/afkanerd/deku/Images/Images/'
                exclude 'com/afkanerd/deku/DefaultSMS/Deprecated/*'
                exclude 'com/afkanerd/deku/DefaultSMS/Deprecated'
                /* The holder name I want to excludes its all classes */
            }
            kotlin {
                exclude 'com/afkanerd/deku/DefaultSMS/Deprecated/*'
                /* The holder name I want to excludes its all classes */
            }
            resources {
                srcDirs 'src/main/resources'
            }
        }
    }

    buildTypes {
        debug {
//            minifyEnabled true
//            shrinkResources true
//            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
//            testProguardFiles 'proguard-rules.pro'
        }
        release {
//            minifyEnabled false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packaging {
        resources {
            it.excludes += "/META-INF/{LICENSE.md,NOTICE.md}"
        }
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            // Look up the ABI name from the variant filters
            def abiFilter = output.filters.find { it.filterType.name() == "ABI" }?.identifier
            def baseAbiVersionCode = project.ext.abiCodes.get(abiFilter)

            if (baseAbiVersionCode != null) {
                // In AGP 9.x, versionCode is a Property wrapper, so we must use .set()
                output.versionCode.set((100 * android.defaultConfig.versionCode) + baseAbiVersionCode)
            } else {
                output.versionCode.set(100 * android.defaultConfig.versionCode)
            }
        }
    }
}

